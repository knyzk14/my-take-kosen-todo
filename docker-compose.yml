services:
  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "18080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-todo}:${POSTGRES_PASSWORD:-todo-dev-password}@db:5432/${POSTGRES_DB:-school_todo}?sslmode=disable"
      MASTER_DATA_PATH: /app/internal/config/master_data.json
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-adminsdk.json
    volumes:
      - ./backend/internal/config/master_data.json:/app/internal/config/master_data.json:ro
      - ./backend/firebase-adminsdk.json:/app/firebase-adminsdk.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "13000:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    container_name: db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-school_todo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data: